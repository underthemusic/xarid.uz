<!DOCTYPE html>
<html lang="uz">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Operator yoki Administrator lavozimiga ariza — Xarid.uz</title>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="ariza.css">
</head>

<body>


  <svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <defs>
      <linearGradient id="a" x1="0" y1="0" x2="1" y2="1">
        <stop offset="0" stop-color="#18d9c2" />
        <stop offset="1" stop-color="#0a6fa8" />
      </linearGradient>
      <linearGradient id="b" x1="0" y1="0" x2="1" y2="1">
        <stop offset="0" stop-color="#ffe08a" />
        <stop offset="1" stop-color="#f0a92e" />
      </linearGradient>
      <symbol id="lg" viewBox="0 0 48 48">
        <rect width="48" height="48" rx="14" fill="url(#a)" />
        <path d="M17 19v-3a7 7 0 0 1 14 0v3" stroke="#fff" stroke-width="2.6" stroke-linecap="round" fill="none" />
        <path d="M12.5 19h23l-1.8 17.2a3.5 3.5 0 0 1-3.5 3.1H17.8a3.5 3.5 0 0 1-3.5-3.1z" fill="#fff" />
        <path d="M19.5 24.5l9 10M28.5 24.5l-9 10" stroke="url(#b)" stroke-width="3.6" stroke-linecap="round" />
      </symbol>
      <symbol id="hs" viewBox="0 0 24 24">
        <path d="M4 14v-2a8 8 0 0 1 16 0v2" />
        <rect x="3" y="14" width="4" height="6" rx="1.5" />
        <rect x="17" y="14" width="4" height="6" rx="1.5" />
      </symbol>
      <symbol id="bk" viewBox="0 0 24 24">
        <path d="M19 12H5M11 18l-6-6 6-6" />
      </symbol>
      <symbol id="ar" viewBox="0 0 24 24">
        <path d="M5 12h14M13 6l6 6-6 6" />
      </symbol>
      <symbol id="ck" viewBox="0 0 24 24">
        <path d="M5 12.5l4.5 4.5L19 7.5" />
      </symbol>
    </defs>
  </svg>

  <header class="top-bar">
    <div class="w">
      <a class="logo" href="index.html"><svg>
          <use href="#lg" />
        </svg><span>Xarid<i>.uz</i></span></a>
      <a class="back-btn" href="ishjoy.html"><svg class="i">
          <use href="#bk" />
        </svg> Orqaga qaytish</a>
    </div>
  </header>

  <main class="form-main">
    <div class="w">
      <div class="form-container">

        <input type="checkbox" id="submit-toggle" class="sr">

        <div class="form-content">
          <div class="form-header">
            <div class="job-badge"><svg class="i">
                <use href="#hs" />
              </svg> Operator yoki Administrator</div>
            <h2>Nomzod anketi</h2>
            <p>Mijozlar bilan ishlash va qo‘ng‘iroqlarni boshqarish bo‘limiga o‘z ma’lumotlaringizni qoldiring.</p>
          </div>

          <form action="#" method="POST" class="application-form">

            <div class="form-row">
              <div class="input-group">
                <label for="ism">Ismingiz</label>
                <input type="text">
              </div>
              <div class="input-group">
                <label for="familiya">Familiyangiz</label>
                <input type="text">
              </div>
            </div>

            <div class="form-row">
              <div class="input-group">
                <label for="telefon">Telefon raqamingiz</label>
                <div class="phone-wrap">
                  <span class="prefix">+998</span>
                  <input type="tel">
                </div>
              </div>
              <div class="input-group">
                <label for="til">Tillarni bilish darajasi</label>
                <select>
                  <option>Tanlang...</option>
                  <option>O‘zbek va Rus tillari</option>
                  <option>O‘zbek, Rus va Ingliz tillari</option>
                  <option>Boshqa tillar ham</option>
                </select>
              </div>
            </div>

            <div class="input-group">
              <label for="tajriba">Ish tajribangiz</label>
              <select id="tajriba" name="tajriba" required>
                <option value="" disabled selected>Tajribani tanlang...</option>
                <option value="yoge">Tajribasiz (O‘rgatamiz)</option>
                <option value="1-yil">1 yil</option>
                <option value="1-3-yil">2 yil-3 yil</option>
                <option value="3-yildan-kop">3 yildan ortiq</option>
              </select>
            </div>

            <div class="input-group">
              <label for="qoshimcha">O‘zingiz haqingizda qisqacha</label>
              <textarea id="qoshimcha" name="qoshimcha" rows="4"
                placeholder="Kompyuterda ishlash ko‘nikmalari va shaxsiy fazilatlaringiz..."></textarea>
            </div>

            <label for="submit-toggle" class="btn-submit" role="button" tabindex="0">
              Arizani yuborish <svg class="i">
                <use href="#ar" />
              </svg>
            </label>

            <p class="form-footer-text">Ariza yuborilgandan so‘ng HR bo‘limi 24 soat ichida siz bilan bog‘lanadi.</p>

          </form>
        </div>



      </div>
    </div>
  </main>

</body>

</html>
